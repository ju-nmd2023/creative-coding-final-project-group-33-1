<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ATTENTION</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.6.0/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
    <script src="verdash4.js"></script>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #fff;
        position: relative;
      }

      h1 {
        position: absolute;
        top: 20px; /* distance from top */
        width: 100%;
        text-align: center;
        font-family: sans-serif;
        font-weight: bold;
        font-size: 48px;
        margin: 0;
        pointer-events: none; /* allows clicking through to canvas */
        color: black;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>One Click Attention</h1>
  </body>
</html>
